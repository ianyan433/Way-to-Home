<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0, minimum-scale=0.8">
  <title>地铁归途 · 因果交织</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a1219;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
      padding: 15px;
    }
    .game-container {
      max-width: 780px;
      width: 100%;
      background: #1a2c38;
      border-radius: 32px;
      box-shadow: 0 25px 45px rgba(0,0,0,0.7), inset 0 0 15px rgba(100,180,220,0.3);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid #3d5a6c;
      position: relative;
    }
    .status-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      background: #0b1921;
      border-radius: 22px;
      padding: 12px 18px;
      color: #d0e5f5;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
      gap: 8px;
    }
    .stat {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #1e3342;
      padding: 5px 14px;
      border-radius: 24px;
      white-space: nowrap;
    }
    .stat span:last-child {
      color: #f9e076;
      font-weight: bold;
      margin-left: 4px;
    }
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0b1921;
      border-radius: 22px;
      padding: 8px 18px;
    }
    .progress-bar {
      width: 180px;
      height: 12px;
      background: #2e4555;
      border-radius: 8px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #48c774, #f7dc6f);
      transition: width 0.4s ease;
      border-radius: 8px;
    }
    canvas {
      background: #192934;
      border-radius: 26px;
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 10px 22px rgba(0,0,0,0.6), inset 0 0 15px #294351;
      border: 1px solid #3f5b6b;
    }
    .event-text {
      background: #0e1e28;
      border-radius: 18px;
      padding: 14px 18px;
      color: #ecf3fa;
      font-size: 1.05rem;
      line-height: 1.55;
      border-left: 6px solid #5dade2;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      min-height: 70px;
    }
    .button-row {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .primary-btn {
      background: #2c5f7e;
      border: none;
      color: white;
      font-weight: bold;
      padding: 14px 28px;
      border-radius: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 5px 12px rgba(0,0,0,0.5);
      border-bottom: 4px solid #1c3a4b;
      letter-spacing: 1px;
    }
    .primary-btn:hover {
      background: #3b7ba0;
      border-bottom-color: #f1c40f;
      transform: translateY(-2px);
    }
    .primary-btn:active {
      transform: translateY(2px);
      box-shadow: 0 3px 6px rgba(0,0,0,0.5);
    }
    .primary-btn:disabled {
      opacity: 0.6;
      pointer-events: none;
      transform: none;
    }
    /* 模态弹窗 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }
    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }
    .modal-box {
      background: #1e2f3c;
      border-radius: 28px;
      padding: 24px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 0 2px #f1c40f;
      color: #f0f6fc;
      border: 1px solid #f39c12;
      transform: scale(0.9);
      transition: 0.2s;
    }
    .active .modal-box {
      transform: scale(1);
    }
    .modal-title {
      font-size: 1.6rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: #f7dc6f;
      text-shadow: 0 2px 5px black;
      border-left: 6px solid #e67e22;
      padding-left: 15px;
    }
    .modal-desc {
      background: #0f1e28;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      font-size: 1.1rem;
      line-height: 1.5;
    }
    .modal-choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-choice {
      background: #2c4b5e;
      border: none;
      color: white;
      font-weight: bold;
      padding: 14px 16px;
      border-radius: 22px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.15s;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 3px solid #1f628d;
    }
    .modal-choice:hover:not(:disabled) {
      background: #3e6f8c;
      border-bottom-color: #f39c12;
    }
    .modal-choice:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(0.3);
    }
  </style>
</head>
<body>
<div class="game-container">
  <div class="status-panel">
    <div class="stat">💪体力 <span id="staminaVal">100</span></div>
    <div class="stat">🧠精力 <span id="energyVal">100</span></div>
    <div class="stat">💰金钱 <span id="moneyVal">50</span></div>
    <div class="stat">❤️魅力 <span id="charmVal">0</span></div>
    <div class="stat">⚡权力 <span id="powerVal">0</span></div>
    <div class="stat">🎒物品 <span id="itemsVal">无</span></div>
  </div>

  <canvas id="trainCanvas" width="720" height="340" aria-label="地铁车厢内部视角，简单线条人物"></canvas>

  <div class="progress-wrap">
    <span style="color:#c2e0f0;">🚇 第 <span id="currentStation">1</span>/30 站</span>
    <div class="progress-bar"><div id="progressFill" class="progress-fill" style="width: 3%;"></div></div>
    <span id="stationName" style="color:#f4d03f; font-weight: bold;">公司</span>
  </div>

  <div class="event-text" id="eventDescription">你刚下班，踏上地铁。车厢里人还不多，你看见一个空座位……</div>

  <div class="button-row">
    <button id="nextStationBtn" class="primary-btn">▶ 下一站</button>
  </div>
</div>

<!-- 事件弹窗 -->
<div class="modal-overlay" id="eventModal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">⚡ 特殊事件</div>
    <div class="modal-desc" id="modalDesc">事件描述</div>
    <div class="modal-choices" id="modalChoices"></div>
  </div>
</div>

<script>
  (() => {
    // ---------- 核心状态 ----------
    const TOTAL_STATIONS = 30;
    const state = {
      station: 0,          // 0 = 公司起点
      stamina: 100,
      energy: 100,
      money: 50,
      charm: 0,
      power: 0,
      items: [],
      isSeated: false,
      gameOver: false,
      gameResult: null,    // 'home' | 'failed'
      failReason: '',
      flags: {},           // 存储各种因果标记，如 { helpedElderly: true, ignoredYouth: true }
      log: [],
      waitingForEvent: false,
    };

    // UI元素
    const canvas = document.getElementById('trainCanvas');
    const ctx = canvas.getContext('2d');
    const staminaSpan = document.getElementById('staminaVal');
    const energySpan = document.getElementById('energyVal');
    const moneySpan = document.getElementById('moneyVal');
    const charmSpan = document.getElementById('charmVal');
    const powerSpan = document.getElementById('powerVal');
    const itemsSpan = document.getElementById('itemsVal');
    const stationSpan = document.getElementById('currentStation');
    const progressFill = document.getElementById('progressFill');
    const stationNameSpan = document.getElementById('stationName');
    const eventDescDiv = document.getElementById('eventDescription');
    const nextBtn = document.getElementById('nextStationBtn');
    const modal = document.getElementById('eventModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const modalChoices = document.getElementById('modalChoices');

    // ---------- 事件系统 ----------
    // 事件定义：id, desc, options[], requiredFlags (对象，需全部满足), forbiddenFlags (不能有的标记),
    // priority (数字越大越优先), minStation (最低站数)
    const events = [
      // 起始事件
      {
        id: 'start',
        desc: '你刚下班，踏上地铁。车厢里人还不多，你看见一个空座位……',
        minStation: 0,
        options: [
          { text: '🪑 坐下休息', effects: { stamina: 8 }, setSeated: true, log: '你舒服地坐下，养精蓄锐。', flags: {} },
          { text: '🧍 继续站着', effects: {}, log: '你选择站立，保持警觉。', flags: {} }
        ]
      },
      // 普通空座事件
      {
        id: 'empty_seat',
        desc: '旁边恰好空出一个座位，不少人盯着。',
        options: [
          { text: '🏃 快速坐下', effects: { stamina: 6, energy: -3 }, setSeated: true, log: '你眼明手快，成功坐下。' },
          { text: '🤝 让给他人', effects: { charm: 7, energy: -1 }, log: '你礼貌示意他人就座，内心平和。' }
        ]
      },
      // 老人事件
      {
        id: 'elderly',
        desc: '一位白发苍苍的老人站在你附近，抓着扶手微微颤抖。',
        options: [
          { text: '🧓 让座 (需坐着)', effects: { stamina: -4, charm: 15, energy: 2 }, requiresSeated: true, 
            setSeated: false, flags: { helpedElderly: true }, log: '你起身让座，老人连连感谢。' },
          { text: '😶 视而不见', effects: { energy: -10, charm: -4 }, flags: { ignoredElderly: true }, log: '你装作没看见，内心有些不安。' },
          { text: '💬 口头关心', effects: { charm: 3, energy: -3 }, log: '你询问老人状况，但并未让座。' }
        ]
      },
      // 社会青年挑衅
      {
        id: 'youth_gang',
        desc: '几个穿着浮夸的青年挤过来，其中一个染着黄毛的青年盯着你的座位：“喂，让个座？”',
        options: [
          { text: '🪑 老实让座 (需坐着)', effects: { stamina: -2, energy: -8, charm: -2 }, requiresSeated: true, 
            setSeated: false, flags: { gaveUpSeatToYouth: true }, log: '你无奈起身，青年得意地坐下。' },
          { text: '✊ 拒绝并瞪回去', effects: { stamina: -15, energy: -5, power: 8 }, flags: { defiedYouth: true }, 
            log: '你毫不退让，青年骂骂咧咧但最终走开。' },
          { text: '😨 低头不语 (站着时)', effects: { energy: -12, charm: -3 }, requiresStanding: true, 
            log: '你假装没听到，青年嘲讽几句后离开。' }
        ]
      },
      // 美女邂逅
      {
        id: 'beauty',
        desc: '一位气质优雅的女士站在你身侧，淡淡的香水味飘来。',
        options: [
          { text: '😊 微笑搭讪', effects: { charm: 10, energy: -6 }, log: '你们愉快交谈，氛围很好。' },
          { text: '🪑 让座给她 (需坐着)', effects: { charm: 18, stamina: -3 }, requiresSeated: true, 
            setSeated: false, flags: { gaveSeatToBeauty: true }, log: '你起身让座，她回以甜美微笑。' },
          { text: '📵 继续看手机', effects: { energy: 2 }, log: '你专注屏幕，错过一次邂逅。' }
        ]
      },
      // 推销员
      {
        id: 'salesman',
        desc: '一个西装男凑近：“兄弟，来瓶神奇能量饮料吗？只要15块！”',
        options: [
          { text: '💵 购买 (花费15)', effects: { money: -15, items: ['能量饮料'], stamina: 8, energy: 12 }, log: '你买下饮料，喝后精神焕发。' },
          { text: '🙅 拒绝', effects: {}, log: '你摆摆手，他转身寻找下一个目标。' }
        ]
      },
      // 乞丐
      {
        id: 'beggar',
        desc: '一个衣衫破旧的乞丐向你伸出铁碗，眼神恳切。',
        options: [
          { text: '🪙 施舍5元', effects: { money: -5, energy: 5, charm: 5 }, log: '你递出零钱，乞丐鞠躬道谢。' },
          { text: '😐 摇头拒绝', effects: {}, log: '你移开目光，乞丐慢慢走开。' }
        ]
      },
      // 吵架劝架
      {
        id: 'conflict',
        desc: '两名乘客因碰撞激烈争吵，眼看要动手。',
        options: [
          { text: '🤝 上前劝架', effects: { stamina: -12, power: 6, charm: 4 }, log: '你费力拉开两人，平息了争端。' },
          { text: '👀 袖手旁观', effects: { energy: -5 }, log: '你默默观望，直到乘务员赶来。' }
        ]
      },
      // 让座后的因果事件
      {
        id: 'elderly_gratitude',
        desc: '之前你让座的老人从包里掏出一盒精美点心，非要送给你表示感谢。',
        requiredFlags: { helpedElderly: true },
        forbiddenFlags: { elderlyGiftReceived: true },
        minStation: 5,
        options: [
          { text: '🎁 欣然接受', effects: { items: ['老人点心'], charm: 5, energy: 5 }, flags: { elderlyGiftReceived: true }, log: '老人开心地塞给你点心。' },
          { text: '🙏 婉拒', effects: { charm: 8, energy: 2 }, flags: { elderlyGiftReceived: true }, log: '你礼貌拒绝，老人竖起大拇指。' }
        ]
      },
      {
        id: 'elderly_help',
        desc: '突然有人碰落你的背包，那位你曾帮助的老人立刻帮你捡起并指责对方。',
        requiredFlags: { helpedElderly: true },
        minStation: 8,
        options: [
          { text: '😊 感激道谢', effects: { charm: 6, energy: 4 }, log: '老人笑着说“互相帮助嘛”。' }
        ]
      },
      // 不让老人的后果
      {
        id: 'guilty_glance',
        desc: '周围乘客对你投来不满的目光，窃窃私语。',
        requiredFlags: { ignoredElderly: true },
        minStation: 4,
        options: [
          { text: '😣 羞愧低头', effects: { energy: -8, charm: -5 }, log: '你感到尴尬，站姿都僵硬了。' }
        ]
      },
      // 社会青年报复 (不让青年)
      {
        id: 'youth_retaliation',
        desc: '突然，之前那个黄毛青年故意撞了你一下，还踩了你一脚。',
        requiredFlags: { defiedYouth: true },
        forbiddenFlags: { youthRetaliated: true },
        minStation: 8,
        options: [
          { text: '😤 推回去', effects: { stamina: -12, power: 5 }, flags: { youthRetaliated: true }, log: '你们推搡了几下，对方骂骂咧咧离开。' },
          { text: '😠 忍气吞声', effects: { energy: -15, charm: -3 }, flags: { youthRetaliated: true }, log: '你咬牙忍住，周围人同情地看着你。' }
        ]
      },
      // 如果让座给美女，后续可能获得联系方式
      {
        id: 'beauty_contact',
        desc: '那位你让座的女士递来一张纸条：“这是我的名片，有空喝咖啡。”',
        requiredFlags: { gaveSeatToBeauty: true },
        forbiddenFlags: { gotBeautyContact: true },
        minStation: 10,
        options: [
          { text: '📇 收下名片', effects: { items: ['美女名片'], charm: 10, energy: 5 }, flags: { gotBeautyContact: true }, log: '你小心收好，心跳加速。' },
          { text: '😳 害羞婉拒', effects: { charm: 4 }, flags: { gotBeautyContact: true }, log: '你脸红拒绝，但内心窃喜。' }
        ]
      },
      // 通用小事件
      {
        id: 'rain_umbrella',
        desc: '外面下起大雨，一位没带伞的乘客询问能否共享你的折叠伞(如果你有)。',
        options: [
          { text: '☂️ 分享雨伞 (需物品:折叠伞)', effects: { charm: 12, energy: -2 }, requiresItem: '折叠伞', log: '你们一起撑伞，聊得投机。' },
          { text: '😞 没有伞', effects: {}, log: '你无奈摇头，对方叹气。' }
        ]
      },
      {
        id: 'power_broker',
        desc: '一位猎头悄悄说：“我看你很有气场，有名片吗？”',
        options: [
          { text: '📇 递名片 (需物品:名片)', effects: { power: 15, energy: -2 }, requiresItem: '名片', log: '他收下名片，表示会联系。' },
          { text: '🤐 婉拒', effects: {}, log: '你礼貌拒绝，继续旅程。' }
        ]
      },
      {
        id: 'stampede',
        desc: '到站时人群突然推挤，你站立不稳。',
        options: [
          { text: '💪 奋力稳住', effects: { stamina: -8, energy: -4 }, log: '你站稳了，但消耗不少体力。' },
          { text: '🧎 顺势蹲下', effects: { stamina: -3, energy: -2 }, log: '你蹲下躲避，有惊无险。' }
        ]
      }
    ];

    // 更新UI数值
    function refreshUI() {
      staminaSpan.textContent = Math.max(0, state.stamina);
      energySpan.textContent = Math.max(0, state.energy);
      moneySpan.textContent = state.money;
      charmSpan.textContent = state.charm;
      powerSpan.textContent = state.power;
      itemsSpan.textContent = state.items.length === 0 ? '无' : state.items.join('、');

      const displayStation = state.station + 1;
      stationSpan.textContent = displayStation;
      const percent = Math.min(100, (state.station / TOTAL_STATIONS) * 100);
      progressFill.style.width = `${percent}%`;

      if (state.station === 0) stationNameSpan.textContent = '公司';
      else if (state.station >= TOTAL_STATIONS) stationNameSpan.textContent = '🏠家';
      else stationNameSpan.textContent = `第${displayStation}站`;

      drawTrain();
    }

    // 绘制车厢 (简单线条)
    function drawTrain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#1b2b35';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#56707d';
      ctx.lineWidth = 3;
      ctx.strokeRect(10, 10, canvas.width-20, canvas.height-20);
      // 扶手
      ctx.beginPath(); ctx.strokeStyle = '#a2b9c7'; ctx.lineWidth=2;
      ctx.moveTo(30,45); ctx.lineTo(canvas.width-30,45); ctx.stroke();
      for(let i=0;i<6;i++){ let x=70+i*110; ctx.beginPath(); ctx.strokeStyle='#bcccd6'; ctx.arc(x,65,12,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x,53); ctx.lineTo(x,45); ctx.stroke(); }
      ctx.fillStyle='#334a58'; ctx.fillRect(20,canvas.height-65,75,22); ctx.fillRect(canvas.width-95,canvas.height-65,75,22);
      ctx.strokeStyle='#6b8395'; ctx.strokeRect(20,canvas.height-65,75,22); ctx.strokeRect(canvas.width-95,canvas.height-65,75,22);
      // 窗户
      ctx.fillStyle='#1d303c'; ctx.fillRect(115,35,125,65); ctx.fillRect(280,35,125,65); ctx.fillRect(445,35,125,65);
      ctx.strokeStyle='#4b6a7c'; ctx.strokeRect(115,35,125,65); ctx.strokeRect(280,35,125,65); ctx.strokeRect(445,35,125,65);
      // NPC
      drawStick(160,245,'#8899a6',false); drawStick(290,238,'#8e9eab',false);
      drawStick(510,242,'#8899a6',false); drawStick(610,250,'#8e9eab',false);
      drawSeated(45,canvas.height-75,'#7f8c8d'); drawSeated(canvas.width-65,canvas.height-75,'#7f8c8d');
      if(state.isSeated) drawSeated(canvas.width-145,canvas.height-75,'#3498db');
      else drawStick(400,230,'#3498db',true);
    }
    function drawStick(x,y,col,player=false){ctx.strokeStyle=col;ctx.lineWidth=player?2.5:1.8;ctx.beginPath();ctx.arc(x,y-25,10,0,2*Math.PI);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y-15);ctx.lineTo(x,y+15);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y+15);ctx.lineTo(x-8,y+35);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y+15);ctx.lineTo(x+8,y+35);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y-5);ctx.lineTo(x-15,y+5);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y-5);ctx.lineTo(x+15,y+5);ctx.stroke();}
    function drawSeated(x,y,col){ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(x,y-18,8,0,2*Math.PI);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y-10);ctx.lineTo(x,y+5);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y+5);ctx.lineTo(x-12,y+20);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y+5);ctx.lineTo(x+12,y+20);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y-5);ctx.lineTo(x-10,y);ctx.stroke();}

    function applyEffects(effects, setSeated=null, newFlags={}, logText='') {
      if(effects.stamina) state.stamina = Math.min(150, Math.max(0, state.stamina + effects.stamina));
      if(effects.energy) state.energy = Math.min(150, Math.max(0, state.energy + effects.energy));
      if(effects.money) state.money = Math.max(0, state.money + effects.money);
      if(effects.charm) state.charm += effects.charm;
      if(effects.power) state.power += effects.power;
      if(effects.items) effects.items.forEach(it => { if(!state.items.includes(it)) state.items.push(it); });
      if(setSeated !== null) state.isSeated = setSeated;
      Object.assign(state.flags, newFlags);
      if(logText) state.log.push(`第${state.station+1}站: ${logText}`);
      checkGameOver();
    }

    function checkGameOver() {
      if(state.stamina <= 0) { state.gameOver = true; state.gameResult = 'failed'; state.failReason = '体力耗尽，你晕倒被送医。'; }
      else if(state.energy <= 0) { state.gameOver = true; state.gameResult = 'failed'; state.failReason = '精力枯竭，你恍惚坐过站，迷失在城市。'; }
      if(state.gameOver) showEnding();
    }

    function showEnding() {
      closeModal();
      nextBtn.style.display = 'none';
      if(state.gameResult === 'home') {
        let s = '🏠 恭喜！你顺利到家！\n\n📊 最终属性：\n';
        s += `体力${state.stamina} | 精力${state.energy} | 金钱${state.money}\n魅力${state.charm} | 权力${state.power}\n`;
        s += `🎒物品：${state.items.length?state.items.join('、'):'无'}\n\n📜旅途摘要：\n` + state.log.slice(-6).join('\n');
        eventDescDiv.innerText = s;
      } else {
        eventDescDiv.innerText = `❌ ${state.failReason}\n游戏结束。刷新页面重新开始。`;
      }
      refreshUI();
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    function openEventModal(event) {
      modalTitle.textContent = '⚡ 特殊事件';
      modalDesc.textContent = event.desc;
      modalChoices.innerHTML = '';
      event.options.forEach((opt, idx) => {
        let disabled = false;
        if(opt.requiresSeated && !state.isSeated) disabled = true;
        if(opt.requiresStanding && state.isSeated) disabled = true;
        if(opt.requiresItem && !state.items.includes(opt.requiresItem)) disabled = true;
        const btn = document.createElement('button');
        btn.className = 'modal-choice';
        btn.textContent = opt.text;
        if(disabled) { btn.disabled = true; btn.style.opacity='0.5'; }
        btn.addEventListener('click', () => {
          if(disabled) return;
          applyEffects(opt.effects, opt.setSeated!==undefined?opt.setSeated:null, opt.flags||{}, opt.log||'');
          closeModal();
          state.waitingForEvent = false;
          if(state.gameOver) { showEnding(); return; }
          eventDescDiv.innerText = '事件已处理，点击“下一站”继续旅程。';
          nextBtn.style.display = 'block';
          refreshUI();
        });
        modalChoices.appendChild(btn);
      });
      modal.classList.add('active');
    }

    function getAvailableEvents() {
      return events.filter(ev => {
        if(ev.minStation && state.station < ev.minStation) return false;
        if(ev.requiredFlags) {
          for(let [k,v] of Object.entries(ev.requiredFlags)) {
            if(!!state.flags[k] !== v) return false;
          }
        }
        if(ev.forbiddenFlags) {
          for(let [k,v] of Object.entries(ev.forbiddenFlags)) {
            if(state.flags[k] === v) return false;
          }
        }
        return true;
      });
    }

    function triggerEvent() {
      if(state.gameOver) return;
      const available = getAvailableEvents();
      if(available.length === 0) {
        eventDescDiv.innerText = '车厢内暂时平静，列车继续前行。';
        nextBtn.style.display = 'block';
        refreshUI();
        return;
      }
      // 优先选取带requiredFlags的事件（因果事件），否则随机
      const priorityEvents = available.filter(e => e.requiredFlags);
      const chosen = priorityEvents.length > 0 ? 
        priorityEvents[Math.floor(Math.random() * priorityEvents.length)] :
        available[Math.floor(Math.random() * available.length)];
      state.waitingForEvent = true;
      nextBtn.style.display = 'none';
      openEventModal(chosen);
    }

    function nextStation() {
      if(state.gameOver || state.waitingForEvent) return;
      state.station++;
      if(state.isSeated && Math.random()<0.25) {
        state.isSeated = false;
        state.log.push(`第${state.station+1}站: 有人下车，你起身让出座位。`);
      }
      if(state.station >= TOTAL_STATIONS) {
        state.gameOver = true;
        state.gameResult = 'home';
        showEnding();
        return;
      }
      // 判定是否触发事件
      if(Math.random() < 0.75 || state.station === 0) {
        triggerEvent();
      } else {
        eventDescDiv.innerText = `列车平稳行驶... 第${state.station+1}站到了。`;
        nextBtn.style.display = 'block';
        refreshUI();
      }
    }

    function startGame() {
      state.station = 0; state.stamina=100; state.energy=100; state.money=50; state.charm=0; state.power=0;
      state.items=[]; state.isSeated=false; state.gameOver=false; state.gameResult=null; state.failReason='';
      state.flags={}; state.log=[]; state.waitingForEvent=false;
      closeModal();
      nextBtn.style.display = 'none';
      // 触发起始事件
      const startEv = events.find(e=>e.id==='start');
      if(startEv) { state.waitingForEvent=true; openEventModal(startEv); }
      refreshUI();
    }

    nextBtn.addEventListener('click', nextStation);
    window.addEventListener('load', startGame);
  })();
</script>
</body>
</html>
